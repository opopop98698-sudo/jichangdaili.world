# Apache VirtualHost 配置示例: jichangdaili.world
# 路径建议: /etc/apache2/sites-available/jichangdaili.world.conf 或 /etc/httpd/conf.d/jichangdaili.world.conf

<VirtualHost *:80>
    ServerName jichangdaili.world
    ServerAlias www.jichangdaili.world

    # 强制重定向至 HTTPS 规范域名
    RewriteEngine On
    RewriteRule ^(.*)$ https://jichangdaili.world$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName jichangdaili.world
    ServerAlias www.jichangdaili.world
    DocumentRoot /var/www/jichangdaili.world/dist

    # 规范化非 www 域名
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.jichangdaili\.world$ [NC]
    RewriteRule ^(.*)$ https://jichangdaili.world$1 [R=301,L]

    # SSL 证书配置 (按服务器实际路径替换)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/jichangdaili.world/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jichangdaili.world/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    <Directory "/var/www/jichangdaili.world/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # 真实 404 错误页定义
    ErrorDocument 404 /404.html

    # 日志记录 (生产审计)
    ErrorLog ${APACHE_LOG_DIR}/jichangdaili_world_error.log
    CustomLog ${APACHE_LOG_DIR}/jichangdaili_world_access.log combined
</VirtualHost>
